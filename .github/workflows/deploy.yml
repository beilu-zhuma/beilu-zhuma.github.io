name: Deploy Hugo to GitHub Pages

on:
    push:
        branches: ["source"]
    workflow_dispatch:
    schedule:
        # Runs everyday at 8:00 AM (UTC 0:00)
        - cron: "0 0 * * *"

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: true
                  fetch-depth: 0

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v3
              with:
                  hugo-version: "0.162.1"
                  extended: true

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Build Web
              run: hugo --minify --cleanDestinationDir

            - name: Upload Pages Artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: ./public

    deploy:
        runs-on: ubuntu-latest
        needs: build
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy Web
              id: deployment
              uses: actions/deploy-pages@v4
